name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,rpm,appimage'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nicle v__VERSION__'
          releaseBody: |
            ### Nicle Release v__VERSION__

            Lightweight, responsive desktop code editor built with Tauri 2, Svelte 5, and Rust.

            #### Downloads & Installers:
            - **Windows**: `.exe` (NSIS Installer) / `.msi`
            - **Fedora / RHEL / openSUSE**: `.rpm` package
            - **Debian / Ubuntu**: `.deb` package
            - **All Linux (Portable)**: `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
