[package]
name = "nicle"
version = "0.1.0"
description = "A lightweight desktop code editor"
authors = ["yowRiss"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
parking_lot = "0.12"
walkdir = "2"
tiny_http = "0.12"
percent-encoding = "2"
mime_guess = "2"
tempfile = "3"
notify = "8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"


[features]
custom-protocol = ["tauri/custom-protocol"]
